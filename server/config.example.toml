# Template for config.toml, which holds this machine's settings and isn't in git.
# Copy it to start: cp config.example.toml config.toml

# Stop codes as shown on the bus stop sign (GTFS stop_code, e.g. 1117 -> stop_id "0:1117").
# Codes missing from the static feed are skipped (and shown as missing) until they appear.
# Every stop gets departures, comparison with UCOP's stop page where it has one, and observed
# departures (from vehicle positions) for accuracy analysis. UCOP has stop pages but no display
# image for 586, 585, 148 and 147 (2026-11-07).
stops = ["1117", "1131", "1054", "372", "132", "175", "168", "118", "136", "113",
         "586", "585", "148", "147"]

# Relative paths are relative to this file
data_dir = "data"

[feeds]
static_url = "https://gtfs.gptd.cadavl.com/GPTD/GTFS/GTFS_GPTD.zip"
trip_updates_url = "https://gtfsrt.gptd.cadavl.com/ProfilGtfsRt2_0RSProducer-GPTD/TripUpdate.pb"
vehicle_positions_url = "https://gtfsrt.gptd.cadavl.com/ProfilGtfsRt2_0RSProducer-GPTD/VehiclePosition.pb"
# The static zip is rebuilt nightly (~00:30 local); a conditional GET each hour is cheap
static_check_interval_s = 3600
realtime_poll_interval_s = 30
# Trips sometimes drop out of a single TripUpdate fetch; keep their last prediction this long
realtime_hold_missing_s = 120
# If the TripUpdate feed hasn't been fetched successfully for this long, serve the schedule only
# (and say so: "live": false in the payload) rather than predictions that are going stale
realtime_max_age_s = 600

[departures]
# How far ahead to list departures
window_ahead_s = 10800
# Keep showing a departure this long after its estimated time
past_grace_s = 60
# Carry a trip's bus's lateness on its previous trip (same block) into this trip's start, when this
# trip has no prediction for the stop. Measured 2026-11-07 against observed departures: no effect
# with no minimum layover, slightly better 40+ min ahead with 120 s, worse with 300 s. Off until a
# weekday of live observations confirms it (`python -m busboard.accuracy` with block_propagation on).
block_propagation = false
block_layover_s = 120
# Ignore realtime predictions for trips whose vehicle hasn't reported its position in this long.
# Seen 2026-11-06: a real bus went 7.7 min without reporting then came back; ghosts were silent
# for 34 min to 4.8 h.
stale_vehicle_s = 900
# Rows on the board / in the JSON payload
board_rows = 8
# Rows in the JSON payload. More than the board shows, so a board that fetches every few minutes
# and counts down on its own clock still has rows left as buses leave.
payload_rows = 12

[ucop]
base_url = "https://transit.ucop.me"
display_name = "gdem075t41wt"
# One page fetch per stop per interval (UCOP's image is only fetched when a comparison page is viewed)
compare_interval_s = 120
# UCOP truncates times to the minute (up to 59 s) and fetches the feed at different moments
# from us (seen ±99 s on otherwise identical predictions)
match_tolerance_s = 120
# Comparison rows in data/compare.db (~40 rows per stop per snapshot)
retention_days = 14

[logging]
# Inputs of every comparison (realtime feeds + UCOP pages, gzipped, ~100 MB/day for 14 stops),
# so `python -m busboard.replay` can re-run them through changed code. Every static feed
# version is kept too (~2 MB each).
archive_days = 7
static_versions_kept = 30

[publish]
# Push each stop's JSON payload to a web host over SSH/rsync, for the boards to fetch.
# See README.md, "Publishing for the boards", for the DreamHost setup.
enabled = false
# rsync destination; the path must end in /v1. e.g. "busboard_pub@<ssh host>:board.devinmalanaphy.com/v1"
target = ""
public_url = "https://board.devinmalanaphy.com/v1"
interval_s = 30
ssh_key = "~/.ssh/busboard_publish"
# How often to fetch the published index.json back, to check what the boards would actually get
verify_interval_s = 600
