default_fqbn: esp32:esp32:adafruit_feather_esp32s3_nopsram
default_profile: feather_esp32s3

# Pinned build environment, build with:
#   arduino-cli compile src/departure-board
profiles:
  feather_esp32s3:
    notes: Adafruit ESP32-S3 Feather, 8MB flash, no PSRAM
    fqbn: esp32:esp32:adafruit_feather_esp32s3_nopsram
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - GxEPD2 (1.6.9)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - ESP32Time (2.0.6)
